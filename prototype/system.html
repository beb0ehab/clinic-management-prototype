<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كَشْف — نظام إدارة العيادة (بروتوتايب)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1A3A; --ink2:#2A3558; --muted:#6B7491; --line:#E3E7F2; --paper:#F4F6FB; --card:#fff;
  --blue:#2D4BE0; --blue-d:#1E36B4; --blue-soft:#E9EDFF;
  --sun:#FFC24B; --sun-soft:#FFF4D9; --rose:#E5476A; --rose-soft:#FDE9EE; --green:#0F9A66; --green-soft:#DDF5EA;
  --r:14px; --disp:'Alexandria',sans-serif; --body:'IBM Plex Sans Arabic',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;font-weight:600}
.ic{width:20px;height:20px;flex:none}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--ink);color:#C9D0E6;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;color:#fff;font-family:var(--disp);font-weight:800;font-size:22px}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-style:normal;font-size:17px}
.clinic{margin:0 4px 14px;padding:10px 12px;border:1px solid #26335C;border-radius:12px;font-size:13px}
.clinic b{display:block;color:#fff;font-weight:600;font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;text-align:start;color:#C9D0E6;width:100%}
.nav button:hover{background:#18264D;color:#fff}
.nav button.on{background:var(--blue);color:#fff}
.nav .cnt{margin-inline-start:auto;background:var(--sun);color:var(--ink);font-size:12px;padding:0 7px;border-radius:99px}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 10px;border-top:1px solid #26335C;font-size:13px}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue-d);display:grid;place-items:center;font-weight:600;flex:none;font-size:14px}
.me b{color:#fff;display:block;font-weight:600}

.main{min-width:0}
.demo{background:var(--sun-soft);border-bottom:1px solid #F3DFA8;padding:9px 26px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.demo .tag{font-weight:600}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:5px 13px;border-radius:99px;border:1px solid #E6CE8C;background:#fff;font-size:13px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg .sep{width:1px;background:#E6CE8C;margin:2px 6px}
.top{display:flex;align-items:center;gap:14px;padding:16px 26px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--disp);font-size:20px;font-weight:800}
.top .sp{flex:1}
.menu{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 12px;color:var(--muted);width:240px}
.search input{border:0;background:none;outline:0;width:100%}
.view{padding:24px 26px 60px;max-width:1240px}

.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink2);background:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.sun{background:var(--sun);color:var(--ink)}
.btn.sun:hover{background:#F5B32E}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-family:var(--disp);font-size:15.5px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.link{color:var(--blue);font-size:13px;font-weight:600;font-family:var(--body)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1.25fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
.hello{font-family:var(--disp);font-weight:800;font-size:26px;margin-bottom:2px}
.sub{color:var(--muted);margin-bottom:20px}
.kpi small{color:var(--muted);font-size:13px;display:block}
.kpi .num{font-size:28px;display:block;margin-top:4px;line-height:1.2}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--green);font-weight:600}
.kpi em.warn{color:var(--rose)}
.kpi.locked{background:repeating-linear-gradient(135deg,#fff,#fff 8px,#F4F6FB 8px,#F4F6FB 16px);color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-wait{background:var(--sun-soft);color:#8A5A00} .c-in{background:var(--blue-soft);color:var(--blue-d)}
.c-done{background:var(--green-soft);color:#0B6B47} .c-book{background:#EEF0F6;color:var(--ink2)} .c-due{background:var(--rose-soft);color:#A8203F}

/* تذكرة الدور */
.ticket{display:grid;grid-template-columns:auto 1fr;background:var(--ink);color:#fff;border-radius:16px;overflow:hidden;position:relative}
.ticket .no{padding:18px 26px;text-align:center;border-inline-end:2px dashed #3A4A7A;position:relative}
.ticket .no::before,.ticket .no::after{content:"";position:absolute;inset-inline-end:-10px;width:18px;height:18px;border-radius:50%;background:var(--paper)}
.ticket .no::before{top:-9px}.ticket .no::after{bottom:-9px}
.ticket .no small{display:block;color:#A9B3D6;font-size:12px}
.ticket .no .num{font-size:54px;line-height:1;color:var(--sun)}
.ticket .info{padding:16px 20px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.ticket .info b{font-family:var(--disp);font-size:18px;font-weight:600}
.ticket .info span{color:#A9B3D6;font-size:13.5px}
.ticket .info .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

.rows{display:flex;flex-direction:column}
.row-i{display:flex;align-items:center;gap:8px 12px;padding:11px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row-i .who{min-width:130px}
.row-i:first-child{border-top:0}
.row-i .qn{width:38px;height:38px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:15px;flex:none}
.row-i .who{flex:1;min-width:0}
.row-i .who b{display:block;font-weight:600}
.row-i .who span{color:var(--muted);font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.bars i{width:100%;background:var(--blue-soft);border-radius:6px 6px 2px 2px;display:block}
.bars .hi i{background:var(--blue)}
.hbar{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.hbar i{height:9px;border-radius:9px;background:var(--blue);display:block}
.hbar .tr{background:var(--paper);border-radius:9px}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:14px;display:flex;gap:6px;align-items:center}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs .ic{width:14px;height:14px}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:#FAFBFE}
.tw{overflow-x:auto}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head .sp{flex:1}
.tagx{display:inline-block;padding:1px 9px;border-radius:6px;background:var(--rose-soft);color:#A8203F;font-size:12.5px;margin-inline-end:4px}
.tagx.b{background:var(--blue-soft);color:var(--blue-d)}
.lockp{text-align:center;padding:38px 20px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);background:#fff}
.lockp .ic{width:30px;height:30px;color:var(--ink2);margin-bottom:8px}
.lockp b{display:block;color:var(--ink);font-family:var(--disp);font-size:16px;margin-bottom:4px}
.pf{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pf .av{width:58px;height:58px;font-size:20px}
.pf h2{font-family:var(--disp);font-size:21px;font-weight:800}
.pf .meta{color:var(--muted);font-size:14px}
.visit{border-inline-start:3px solid var(--blue-soft);padding:4px 14px 14px;margin-inline-start:6px}
.visit b{font-weight:600}.visit time{color:var(--muted);font-size:13px;display:block}
.rxp{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;background-image:linear-gradient(#EEF1FA 1px,transparent 1px);background-size:100% 38px;background-position:0 62px}
.rxp .rxh{font-family:var(--disp);font-size:30px;font-weight:800;color:var(--blue);line-height:1;margin-bottom:14px}
.rxl{display:grid;grid-template-columns:1.4fr 1fr 1fr 28px;gap:10px;height:38px;align-items:center;font-size:14.5px}
.rxl button{color:var(--muted)}
.form{display:grid;gap:10px}
.form label{font-size:13px;color:var(--ink2);font-weight:500;display:grid;gap:4px}
.in{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;width:100%}
.in:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.file{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;font-size:13.5px}
.file i{display:block;height:64px;border-radius:8px;background:var(--paper);margin-bottom:8px;display:grid;place-items:center;font-style:normal;color:var(--muted);font-family:var(--mono);font-size:12px}

.mx th,.mx td{text-align:center}
.mx th:first-child,.mx td:first-child{text-align:start}
.mx td small{display:block;color:var(--muted);font-size:12.5px}
.sw{width:38px;height:22px;border-radius:99px;background:#D5DAE8;position:relative;transition:.15s;display:inline-block;vertical-align:middle}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)} .sw.on::after{inset-inline-start:19px}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.note{background:var(--blue-soft);color:var(--blue-d);padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px}
.plan{position:relative}
.plan.cur{border:2px solid var(--blue)}
.plan .pr{font-size:30px}
.plan ul{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px;font-size:14px;color:var(--ink2)}
.plan li::before{content:"✓ ";color:var(--green);font-weight:700}
.meter{height:8px;background:var(--paper);border-radius:8px;overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;background:var(--blue);border-radius:8px}

.mb{margin-bottom:16px}.mb8{margin-bottom:10px}
.lbl{display:block;color:var(--muted);font-size:12.5px;margin-bottom:5px}
.kpi .kv1{display:block;margin-top:4px;line-height:1.2}
.kpi .kv1 .num{font-size:28px;display:inline}
.kpi .kv1 small{display:inline}
.dc{display:grid;gap:12px;align-content:start}
.dc h3{margin:0}
.dc .cur{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px}
.dc .cur .num{font-size:30px;color:var(--sun);line-height:1}
.dc .cur b{display:block;font-weight:600}
.dc .cur small{color:#A9B3D6;font-size:12.5px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{padding:3px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px;background:#fff;direction:ltr}
.slot:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv.inv{grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kv.inv dt{color:var(--ink)}
.alert{background:var(--rose-soft);color:#A8203F;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tags .tagx{margin:0;padding:3px 10px;font-size:13.5px}
.tagx button{color:inherit;font-size:15px;line-height:1;padding:0 2px}
.inline{display:flex;gap:8px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
textarea.in{min-height:72px;resize:vertical;font:inherit}
.rxl.bad{color:#A8203F}
.rxl.bad b::after{content:" ⚠ حساسية";font-size:12px}
.dlg{max-height:92vh;overflow:auto}
.ov{position:fixed;inset:0;background:rgba(14,26,58,.45);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:#fff;border-radius:18px;padding:24px;width:min(460px,100%)}
.dlg h3{font-family:var(--disp);font-size:18px;margin-bottom:14px}
.dlg .act{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.on{opacity:1}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:250px;z-index:40;transform:translateX(100%);transition:.2s}
  .side.open{transform:none}
  .menu{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:10px}
  .g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}
  .search{display:none}.view{padding:18px 16px 60px}.top,.demo{padding-inline:16px}
  .ticket .no .num{font-size:42px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><i>ك</i>كَشْف</div>
    <div class="clinic" id="clinic"></div>
    <nav class="nav" id="nav" aria-label="القائمة الرئيسية"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="main">
    <div class="demo">
      <span class="tag">عرض تجريبي — شوف النظام بعين:</span>
      <div class="seg" id="roles"></div>
    </div>
    <header class="top">
      <button class="menu" data-act="menu" aria-label="فتح القائمة"></button>
      <h1 id="title"></h1><span class="sp"></span>
      <label class="search"><span id="sic"></span><input id="q" placeholder="ابحث باسم المريض أو الموبايل" aria-label="بحث عن مريض"></label>
      <button class="btn" data-act="book" id="bookBtn"></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="modal"></div><div id="toast" role="status"></div>

<script src="system.js"></script>
</body>
</html>
